# Release Gate - All checks must pass before release
#
# This workflow runs on release branches and tags to enforce release discipline.
# No release can ship without passing all gates.

name: Release Gate

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/**'

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate 1: Governance invariants
  governance:
    name: Governance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-governance-${{ hashFiles('Cargo.lock') }}
      
      - name: Run governance tests
        run: cargo test --features public_stub --test governance_invariants

  # Gate 2: SDK CI (both Rust and TypeScript)
  sdk-rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build and test
        run: |
          cargo check
          cargo test

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install and test
        run: |
          npm ci
          npm run typecheck
          npm test

  # Gate 3: Version consistency
  # NOTE: v0.x tags are deprecated historical boundary tags.
  # They are re-pointed for IP safety and are not versioned releases.
  # Release Gate enforcement applies only to canonical v1.x releases.
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'v0.') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Check version consistency
        run: |
          # Extract versions
          CRATE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          RUST_SDK_VERSION=$(grep '^version' sdks/rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TS_SDK_VERSION=$(node -p "require('./sdks/typescript/package.json').version")
          
          echo "Crate version: $CRATE_VERSION"
          echo "Rust SDK version: $RUST_SDK_VERSION"
          echo "TypeScript SDK version: $TS_SDK_VERSION"
          
          # For release tags, verify tag matches crate version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_VERSION="${TAG_VERSION%-rc.*}"  # Strip RC suffix
            if [[ "$CRATE_VERSION" != "$TAG_VERSION" ]]; then
              echo "ERROR: Tag version ($TAG_VERSION) does not match Cargo.toml ($CRATE_VERSION)"
              exit 1
            fi
          fi

  # Gate 4: Changelog exists
  # NOTE: v0.x tags are deprecated historical boundary tags (see Gate 3 comment).
  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'v0.') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Verify changelog
        run: |
          if [[ ! -f CHANGELOG.md ]]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi
          
          # For release tags, verify version entry exists
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_VERSION="${TAG_VERSION%-rc.*}"  # Strip RC suffix
            if ! grep -q "## \[$TAG_VERSION\]" CHANGELOG.md; then
              echo "ERROR: No changelog entry for version $TAG_VERSION"
              exit 1
            fi
          fi

  # Gate 5: No substrate leaks in public artifacts
  boundary-check:
    name: Boundary Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Check for substrate leaks
        run: |
          # Ensure SDKs don't reference substrate
          if grep -r "scg\|SCG\|substrate" sdks/rust/src/ 2>/dev/null | grep -v "// "; then
            echo "ERROR: SDK references substrate internals"
            exit 1
          fi
          
          if grep -r "scg\|SCG\|substrate" sdks/typescript/src/ 2>/dev/null | grep -v "// "; then
            echo "ERROR: SDK references substrate internals"
            exit 1
          fi
          
          echo "Boundary check passed"

  # Gate 6: SBOM Generation
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      
      - name: Generate SBOM
        run: cargo sbom > iter-sbom.json
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: iter-sbom.json
          retention-days: 90


  # APEX-SCG-ITER-PROD-001: complete cross-repository release certification.
  apex-productization:
    name: APEX Productization Certification
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'v0.') }}
    env:
      ITER_SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
      TRUSTED_EVIDENCE_WORKFLOW: .github/workflows/apex_productization_evidence.yml
    steps:
      - name: Check out iter release subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ITER_SUBJECT }}
          path: iter
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable SCG release subject
        id: scg-ref
        shell: bash
        run: |
          SCG_REF="$(tr -d '\r\n' < iter/productization/SCG_RELEASE_REF)"
          if [[ ! "$SCG_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::iter/productization/SCG_RELEASE_REF must contain one lowercase 40-hex commit"
            exit 1
          fi
          echo "ref=$SCG_REF" >> "$GITHUB_OUTPUT"

      - name: Locate commit-bound evidence artifact
        id: evidence-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCG_REF: ${{ steps.scg-ref.outputs.ref }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="apex-productization-evidence-${ITER_SUBJECT}-${SCG_REF}"
          mapfile -t RUN_IDS < <(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              -f name="$ARTIFACT_NAME" \
              -f per_page=100 \
              --jq ".artifacts[] | select(.expired == false and .workflow_run.head_sha == \"${ITER_SUBJECT}\") | .workflow_run.id"
          )
          if [[ "${#RUN_IDS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one active ${ARTIFACT_NAME} artifact for ${ITER_SUBJECT}; found ${#RUN_IDS[@]}"
            exit 1
          fi
          EVIDENCE_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_IDS[0]}")"
          EVIDENCE_WORKFLOW="$(jq -r '.path' <<< "$EVIDENCE_RUN")"
          EVIDENCE_CONCLUSION="$(jq -r '.conclusion' <<< "$EVIDENCE_RUN")"
          EVIDENCE_EVENT="$(jq -r '.event' <<< "$EVIDENCE_RUN")"
          if [[ "$EVIDENCE_WORKFLOW" != "$TRUSTED_EVIDENCE_WORKFLOW" ]]; then
            echo "::error::Evidence run workflow ${EVIDENCE_WORKFLOW} is not trusted"
            exit 1
          fi
          if [[ "$EVIDENCE_CONCLUSION" != "success" ]]; then
            echo "::error::Evidence run conclusion must be success, got ${EVIDENCE_CONCLUSION}"
            exit 1
          fi
          if [[ "$EVIDENCE_EVENT" != "workflow_dispatch" ]]; then
            echo "::error::Evidence run must be independently dispatched, got ${EVIDENCE_EVENT}"
            exit 1
          fi
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run-id=${RUN_IDS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check out exact SCG release subject
        uses: actions/checkout@v4
        with:
          repository: aduboseh/SCG
          ref: ${{ steps.scg-ref.outputs.ref }}
          token: ${{ secrets.SCG_PAT || github.token }}
          path: SCG
          fetch-depth: 0
          persist-credentials: false

      - name: Download commit-bound evidence bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.evidence-artifact.outputs.name }}
          path: apex-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence-artifact.outputs.run-id }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            iter -> target
            SCG -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Execute all 30 productization controls
        run: |
          python3 iter/scripts/verify_productization_matrix.py \
            --iter-root iter \
            --scg-root SCG \
            --evidence-dir apex-evidence \
            --evidence-run-id "${{ steps.evidence-artifact.outputs.run-id }}" \
            --report "$RUNNER_TEMP/apex-productization-report.json"

      - name: Upload productization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-productization-report-${{ github.sha }}
          path: ${{ runner.temp }}/apex-productization-report.json
          if-no-files-found: error

  # Final gate: All checks must pass
  release-gate:
    name: Release Gate
    needs: [governance, sdk-rust, sdk-typescript, version-check, changelog-check, boundary-check, apex-productization]
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          echo "✅ All release gates passed"
          echo ""
          echo "Release checklist:"
          echo "  ✓ Governance tests"
          echo "  ✓ Rust SDK"
          echo "  ✓ TypeScript SDK"
          echo "  ✓ Version consistency"
          echo "  ✓ Changelog entry"
          echo "  ✓ Boundary integrity"
          echo "  ✓ SBOM generated (for tags)"
