name: public-boundary-guard
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
jobs:
  ip_boundary_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ================================================================
      # Directory structure guards
      # ================================================================
      - name: Ensure no internal examples directory exists
        run: |
          if [ -d "examples/internal" ]; then
            echo "::error::examples/internal must not exist in the public repo"
            exit 1
          fi

      - name: Ensure no internal src directories exist
        run: |
          # These directories were moved to iter-internal
          for dir in "src/services/sanitizer" "tests/integration"; do
            if [ -d "$dir" ]; then
              echo "::error::$dir must not exist in the public repo"
              exit 1
            fi
          done

      # ================================================================
      # File existence guards (moved files must not reappear)
      # ================================================================
      - name: Block moved internal files
        run: |
          MOVED_FILES=(
            "src/traits.rs"
            "src/mcp_handler.rs"
            "src/substrate_runtime.rs"
            "src/services/sanitizer/forbidden.rs"
            "src/services/sanitizer/response.rs"
            "src/types/audit.rs"
            "src/types/substrate.rs"
            "tests/governance/telemetry.rs"
            "tests/integration/boundary_tests.rs"
            "tests/integration/common.rs"
            "tests/integration/error_handling_tests.rs"
            "tests/integration/tool_endpoint_tests.rs"
            "tests/mcp_integration.rs"
          )
          for file in "${MOVED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "::error::$file must not exist in the public repo (moved to iter-internal)"
              exit 1
            fi
          done

      # ================================================================
      # Content pattern guards (IP leak detection)
      # ================================================================
      - name: Block substrate crate imports
        run: |
          # scg-* crates are proprietary and must not be imported by public code.
          # Contract provenance field names may contain "scg_"; only Rust crate paths are blocked.
          if grep -r -nE --include="*.rs" '(^|[^[:alnum:]_])(extern[[:space:]]+crate[[:space:]]+scg_[[:alnum:]_]*|use[[:space:]]+scg_[[:alnum:]_]*::|scg_[[:alnum:]_]*::)' src tests; then
            echo "::error::Found scg_ crate imports in public source"
            exit 1
          fi

      - name: Block substrate_runtime references
        run: |
          # substrate_runtime module was moved to iter-internal
          if grep -r -n --include="*.rs" "substrate_runtime" src tests; then
            echo "::error::Found substrate_runtime references in public source"
            exit 1
          fi

      - name: Block sanitizer::forbidden references
        run: |
          # Internal sanitization logic was moved to iter-internal
          if grep -r -n --include="*.rs" "sanitizer::forbidden" src tests; then
            echo "::error::Found sanitizer::forbidden references in public source"
            exit 1
          fi

      - name: Block internal imports in public examples
        run: |
          # Public examples must be black-box clients. No internal crate/module wiring.
          if grep -R -nE "iter_mcp_server|crate::internal::|internal::" examples; then
            echo "::error::Found internal import patterns under examples/"
            exit 1
          fi

      - name: INV-VENDOR-001 — reject floating git deps
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          offenders = []
          for cargo_toml in pathlib.Path(".").rglob("Cargo.toml"):
              try:
                  cargo = tomllib.loads(cargo_toml.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"INVARIANT VIOLATION INV-VENDOR-001: failed to parse {cargo_toml}: {exc}")
                  sys.exit(1)

              sections = [
                  cargo.get("dependencies", {}),
                  cargo.get("dev-dependencies", {}),
                  cargo.get("build-dependencies", {}),
                  cargo.get("workspace", {}).get("dependencies", {}),
              ]
              for section in sections:
                  for name, spec in section.items():
                      if isinstance(spec, dict):
                          git_url = spec.get("git")
                          if isinstance(git_url, str) and "scg" in git_url.lower():
                              offenders.append(f"{cargo_toml}:{name}")

          if offenders:
              print(
                  "INVARIANT VIOLATION INV-VENDOR-001: floating git dep to SCG found: "
                  + ", ".join(sorted(offenders))
              )
              print("Use vendored path dep under vendor/ instead")
              sys.exit(1)
          PY

      - name: INV-VENDOR-002 — vendor provenance file must exist
        run: |
          if [ ! -f vendor/governance-bridge/PROVENANCE.md ]; then
            echo "INVARIANT VIOLATION INV-VENDOR-002: PROVENANCE.md missing from vendor"
            exit 1
          fi

      - name: Claim boundary guard
        run: python3 scripts/claim_boundary_check.py

      - name: INV-RUNTIME-001 reject fallback on ScgBacked path
        run: |
          if grep -nE "GovernedLocal|crate::governed::|governed\.local|governed_local|(^|[^[:alnum:]_])fallback([^[:alnum:]_]|$)" src/governance_connector.rs; then
            echo "INVARIANT VIOLATION: INV-RUNTIME-001"
            echo "Fallback or governed-local reference in governance_connector"
            exit 1
          fi
          if grep -nE "unwrap_or|unwrap_or_default|unwrap_or_else" src/governance_connector.rs; then
            echo "INVARIANT VIOLATION: INV-RUNTIME-001"
            echo "unwrap_or-style fallback detected in governance_connector"
            exit 1
          fi

      # ================================================================
      # Build verification
      # ================================================================
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify public_stub compilation
        run: cargo check --all-targets

      - name: Run governance tests
        run: cargo test --test governance_invariants
