name: Governance Guarantees

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  governance-guarantees:
    name: Verify Governance Signals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Verify governance mirror surface exists
        run: |
          required_files=(
            "governance/GOVERNANCE.md"
            "governance/SCG_Governance_v1.0.md"
            "governance/governance.hash"
            "governance/boundary_contract.json"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required governance file missing: $file"
              exit 1
            fi
          done
          echo "✅ Governance mirror surface present"

      - name: Verify derived governance stub boundary
        run: |
          grep -q "This file is not authoritative." governance/GOVERNANCE.md
          grep -q "SCG/governance/SCG_Governance_v1.0.md" governance/GOVERNANCE.md
          grep -q "must fail CI" governance/GOVERNANCE.md
          echo "✅ Derived governance stub boundary is explicit"

      - name: Verify no CRLF line endings
        run: |
          if grep -rIl $'\r' --include="*.rs" --include="*.md" --include="*.toml" --include="*.yml" --include="*.yaml" --include="*.json" . 2>/dev/null; then
            echo "::error::CRLF detected — line ending drift"
            exit 1
          fi
          echo "✅ Line endings OK (LF only)"

      - name: Verify stability baseline exists
        run: |
          if [ ! -f audits/stability_v1.0.0/repo_manifest.sha256 ]; then
            echo "::error::Stability baseline manifest missing"
            exit 1
          fi
          echo "✅ Stability baseline v1.0.0 present"
