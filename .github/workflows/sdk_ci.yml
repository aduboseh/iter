# SDK CI - Isolated tests for client SDKs
# These tests run independently of the substrate

name: SDK CI

on:
  push:
    branches: [main, phase-*]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk_ci.yml'

jobs:
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sdks/rust/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # Verify SDK has no substrate dependencies
      - name: Verify no substrate deps
        run: |
          if grep -r "scg" Cargo.toml; then
            echo "ERROR: SDK must not depend on substrate (SCG)"
            exit 1
          fi
          if grep -r "iter-internal" Cargo.toml; then
            echo "ERROR: SDK must not depend on iter-internal"
            exit 1
          fi

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Verify SDK has no substrate dependencies
      - name: Verify no substrate deps
        run: |
          if grep -r "scg" package.json; then
            echo "ERROR: SDK must not depend on substrate (SCG)"
            exit 1
          fi

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lint-only gate. No semantic/runtime tests.
      - name: Install ruff
        run: python -m pip install ruff==0.4.10

      - name: Ruff check
        run: ruff check .

  sdk-contract:
    name: SDK Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail-closed: contract file must exist and versions must match SDKs.
      - name: Contract presence + version parity
        shell: bash
        run: |
          set -euo pipefail

          test -f sdks/sdk-contract.md
          grep -q '^## Version: 1.0.0$' sdks/sdk-contract.md

          grep -q '^version = "1.0.0"$' sdks/rust/Cargo.toml
          grep -q '"version": "1.0.0"' sdks/typescript/package.json
          grep -q '^version = "1.0.0"$' sdks/python/pyproject.toml

  # Gate: All SDK checks must pass before merge
  sdk-gate:
    name: SDK Gate
    needs: [rust-sdk, typescript-sdk, python-sdk, sdk-contract]
    runs-on: ubuntu-latest
    steps:
      - name: All SDK checks passed
        run: echo "All SDK checks passed"
