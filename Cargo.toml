[package]
name = "iter_mcp_server"
version = "1.0.2"
edition = "2021"
description = "Governed Model Context Protocol server with deterministic execution"
authors = ["Only SG Solutions"]
license = "Apache-2.0"
repository = "https://github.com/aduboseh/iter"
readme = "README.md"

[features]
default = ["public_stub"]
# full_substrate: Reserved unsupported mode. This public repository does not ship
# full substrate semantics and must fail early instead of compiling stub-backed
# binaries that claim FULL_SUBSTRATE provenance.
full_substrate = []
public_stub = []
# schema-gen: enables schemars derives for JSON Schema generation tooling.
schema-gen = ["schemars"]

[[bin]]
name = "iter-server"
path = "src/main.rs"

[[bin]]
name = "iter-verify"
path = "src/bin/iter_verify.rs"

[[bin]]
name = "iter-cli"
path = "src/bin/iter_cli.rs"

[[bin]]
name = "generate-schemas"
path = "src/bin/generate_schemas.rs"
required-features = ["schema-gen"]

[[example]]
name = "governance_demo"
path = "demos/governance_demo.rs"

[[example]]
name = "generate_golden_fixture"
path = "demos/generate_golden_fixture.rs"

[lib]
name = "iter_mcp_server"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true }

# Cryptography
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
governance-bridge = { package = "scg-governance-bridge", path = "vendor/governance-bridge", features = ["test-fixtures"] }

# Error handling
thiserror = "2.0"

# Concurrency
parking_lot = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# RFC 8785 JSON Canonicalization Scheme
serde_json_canonicalizer = "0.3"

# Tracing
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Security: bytes >= 1.11.1 fixes integer overflow UB in BytesMut::reserve
bytes = "1.11.1"

# NOTE: Substrate crates (scg-*) are not embedded here. The supported public
# build uses public_stub; live SCG authority is consumed through the pinned,
# versioned gateway contract. The reserved full_substrate feature fails closed.

[dev-dependencies]
unicode-normalization = "0.1"
approx = "0.5"
proptest = "=1.9.0"
jsonschema = { version = "0.17", default-features = false }

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
